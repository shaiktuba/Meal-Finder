<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Finder</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <h1>🏠 MEAL FINDER</h1>
    </a>
    <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
  </header>

  <!-- side menu is filled from the categories API, see js/common.js -->
  <nav class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeMenuBtn">&times;</button>
    <ul id="menuList"></ul>
  </nav>
  <div class="overlay" id="overlay"></div>

  <!-- ===== HERO / SEARCH ===== -->
  <section class="hero">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search recipes here ..." />
      <button id="searchBtn">&#128269;</button>
    </div>
    <h2>What are your favorite cuisines?</h2>
    <p class="sub-heading">PERSONALIZE YOUR EXPERIENCE</p>
  </section>

  <main>
    <!-- shows up only after a search -->
    <section class="section" id="mealsSection" hidden>
      <h2 class="section-title">Meals</h2>
      <p id="noResultMsg" class="no-result" hidden>No food found</p>
      <div class="grid" id="mealsGrid"></div>
    </section>

    <section class="section alt">
      <h2 class="section-title">Categories</h2>
      <div class="grid" id="categoriesGrid"></div>
    </section>
  </main>

  <script src="JS/common.js"></script>
  <script src="JS/home.js"></script>
</body>
</html>
